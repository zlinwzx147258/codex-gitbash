name: Git Bash fork checks

# Fast checks for the fork-specific pieces: the release workflow, the launcher
# and the Git Bash shell discovery. The full CLI is compiled and smoke-tested by
# the release pipeline, which is far too slow to run on every push.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gitbash-*.yml"
      - ".github/scripts/test_gitbash_*.py"
      - "gitbash/**"
      - "codex-rs/shell-command/**"
      - "codex-rs/core/src/tools/handlers/shell_spec*.rs"
      - "codex-rs/core/src/tools/spec_plan*.rs"
      - "codex-rs/config/src/types.rs"
  pull_request:
    paths:
      - ".github/workflows/gitbash-*.yml"
      - ".github/scripts/test_gitbash_*.py"
      - "gitbash/**"
      - "codex-rs/shell-command/**"
      - "codex-rs/core/src/tools/handlers/shell_spec*.rs"
      - "codex-rs/core/src/tools/spec_plan*.rs"
      - "codex-rs/config/src/types.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    name: Workflow and launcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint the shell scripts
        run: shellcheck --severity=warning gitbash/codex-gitbash.sh gitbash/fetch-rusty-v8.sh

      - name: fetch-rusty-v8 resolves the locked crate version
        run: |
          set -euo pipefail
          expected="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          resolved="$(awk '/^name = "v8"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' codex-rs/Cargo.lock)"
          test "$resolved" = "$expected"

          # The script anchors the release manifest to a checksum committed in
          # third_party/v8, so a rebase that bumps the crate before that file
          # lands would fail every build. Catch it here instead.
          anchor="third_party/v8/rusty_v8_${resolved//./_}_release_manifests.sha256"
          if [[ ! -f "$anchor" ]]; then
            echo "::error::Cargo.lock pins v8 $resolved but $anchor is missing, so the prebuilt cannot be verified."
            exit 1
          fi
          # Behaviour is covered hermetically by test_gitbash_fetch_rusty_v8.py,
          # which serves its own release instead of reaching the network.

      - name: Run workflow unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_gitbash_*.py' -v

  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The fork is rebased onto upstream daily and upstream's CI enforces
      # formatting, so unformatted fork hunks would only surface there. Use the
      # same invocation upstream does.
      - name: cargo fmt --check
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt -- --config imports_granularity=Item --check

  core-tests-linux:
    name: Tool-spec tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The exec_command guidance falls back to the host platform for
      # multi-environment turns, so an assertion that is right on Windows can
      # still be wrong everywhere else -- including upstream's own CI, which
      # this fork is rebased onto every day.
      - name: Set up the Codex-built V8 prebuilt
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Restore Cargo registry and dependency build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: gitbash-core-tests-v1

      - name: Run the fork's tool-spec tests
        working-directory: codex-rs
        shell: bash
        env:
          # Some upstream codex-core tests overflow the default 2 MiB test
          # stack in debug builds.
          RUST_MIN_STACK: "8388608"
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib -- exec_command_guidance windows_agent_shell shell_spec

  launcher-windows:
    name: Launcher smoke test on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Launcher reports a missing executable clearly
        shell: bash
        run: |
          set -euo pipefail
          if ./gitbash/codex-gitbash.sh --version 2>error.log; then
            echo "::error::Launcher should fail without a Codex executable."
            exit 1
          fi
          grep -q "no Codex executable found" error.log

      - name: Launcher passes the Git Bash config override and arguments through
        shell: bash
        run: |
          set -euo pipefail
          # git accepts `-c key=value` overrides exactly like codex does, so it
          # doubles as a stand-in executable for the packaged layout.
          git_exe="$(command -v git)"
          test -x "$git_exe"
          CODEX_GITBASH_EXE="$git_exe" ./gitbash/codex-gitbash.sh --version | tee version.log
          grep -q '^git version' version.log

  shell-detection-windows:
    name: Git Bash detection tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read the Rust toolchain pinned by upstream
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' codex-rs/rust-toolchain.toml)"
          test -n "$channel"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Restore Cargo registry and dependency build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs -> target
          prefix-key: gitbash-checks-v1
          cache-on-failure: true

      - name: Test Git Bash shell discovery
        # `codex-shell-command` owns `git_bash_shell` and pulls in no V8, so it
        # compiles in a couple of minutes. The heavier `codex-core` tool-spec
        # tests run in the release pipeline's full build.
        #
        # CODEX_REQUIRE_GIT_BASH makes the discovery integration test fail
        # instead of skip: the runner does have Git for Windows installed.
        working-directory: codex-rs
        shell: bash
        env:
          CODEX_REQUIRE_GIT_BASH: "1"
        run: cargo test -p codex-shell-command -- --nocapture
