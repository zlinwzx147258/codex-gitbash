name: Promote Git Bash release

on:
  workflow_run:
    workflows:
      - Build Codex Git Bash for Windows
    types:
      - completed

permissions:
  contents: write

jobs:
  promote:
    name: Promote newest published release to formal Latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq '[.[] | select(.draft == false)][0].id')"
          if [[ -z "$release_id" ]]; then
            echo "::error::No published release found to promote."
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f make_latest=true \
            -f prerelease=false \
            --jq '{tag_name, prerelease, draft}'
